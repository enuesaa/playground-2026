services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    ports:
      - 8000:80
    environment:
      - DATABASE_URL=mysql://root:password@mariadb:3306/app?charset=utf8mb4
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11
    environment:
      - MARIADB_DATABASE=app
      - MARIADB_ROOT_PASSWORD=password
    volumes:
      - mariadbdata:/var/lib/mysql
    ports:
      - 3306:3306

volumes:
  mariadbdata:
