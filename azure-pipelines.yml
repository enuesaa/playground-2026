variables:
  azureSubscription: '<サービス接続名>'
  webAppName: '<App Service名>'

steps:
- task: ArchiveFiles@2
  displayName: 'Zip HTML files'
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/site.zip'
