services:
  couchdb:
    image: couchdb:3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["bin/rails", "server", "-b", "0.0.0.0"]
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      COUCHDB_HOST: couchdb
      COUCHDB_PORT: "5984"
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
      COUCHDB_DB_PREFIX: bookshop
    depends_on:
      couchdb:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  couchdb_data:
  bundle_data:
