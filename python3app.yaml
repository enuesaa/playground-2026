apiVersion: apps/v1
kind: Deployment
metadata:
  name: python3app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python3app
  template:
    metadata:
      labels:
        app: python3app
    spec:
      containers:
        - name: python3app
          image: python:3-alpine
          command: ["python3", "-m", "http.server", "8000"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: python3app
spec:
  type: NodePort
  selector:
    app: python3app
  ports:
    - port: 8000
      targetPort: 8000
